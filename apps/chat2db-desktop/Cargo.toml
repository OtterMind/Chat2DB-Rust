[package]
name = "chat2db-desktop"
description = "Tauri desktop delivery surface for Chat2DB Rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true

[[bin]]
name = "chat2db-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
cap-std = "4.0.2"
chat2db-contract = { path = "../../crates/chat2db-contract" }
chat2db-core = { path = "../../crates/chat2db-core" }
chat2db-java-bridge = { path = "../../crates/chat2db-java-bridge" }
chat2db-local = { path = "../../crates/chat2db-local" }
chat2db-web = { path = "../chat2db-web" }
encoding_rs = "0.8.35"
serde.workspace = true
serde_json.workspace = true
tauri = { workspace = true, features = ["wry"] }
tauri-runtime = "=2.9.2"
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
tokio.workspace = true
tracing.workspace = true
trash = "5.2.6"
uuid.workspace = true

[dev-dependencies]
tempfile = "3"

[features]
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true
