[package]
name = "chat2db-desktop"
description = "Tauri desktop delivery surface for Chat2DB Rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true

[[bin]]
name = "chat2db-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
chat2db-contract = { path = "../../crates/chat2db-contract" }
chat2db-core = { path = "../../crates/chat2db-core" }
chat2db-java-bridge = { path = "../../crates/chat2db-java-bridge" }
tauri = { workspace = true, features = ["wry"] }
tauri-runtime = "=2.9.2"
tokio.workspace = true

[dev-dependencies]
tempfile = "3"

[features]
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true
