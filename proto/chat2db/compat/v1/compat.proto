syntax = "proto3";

package chat2db.compat.v1;

import "chat2db/compat/v1/jdbc.proto";

option java_multiple_files = true;
option java_package = "ai.chat2db.rust.compat.protocol.v1";
option java_outer_classname = "CompatibilityProtocol";

message ProtocolVersion {
  uint32 major = 1;
  uint32 minor = 2;
}

message RequestMeta {
  string request_id = 1;
  string trace_id = 2;
  optional string session_id = 3;
  optional uint64 deadline_unix_millis = 4;
  optional string cancellation_id = 5;
}

message ResponseMeta {
  string request_id = 1;
  string trace_id = 2;
  // ExecuteQuery responses use one strictly increasing sequence beginning at
  // zero. The request_id is the stream identity.
  uint64 sequence = 3;
  bool terminal = 4;
}

message ClientEnvelope {
  RequestMeta meta = 1;

  oneof payload {
    ClientHello hello = 10;
    Ping ping = 11;
    Shutdown shutdown = 12;
    Quiesce quiesce = 13;
    Resume resume = 14;
    LoadDriverRequest load_driver = 100;
    UnloadDriverRequest unload_driver = 101;
    OpenSessionRequest open_session = 110;
    CloseSessionRequest close_session = 111;
    BeginTransactionRequest begin_transaction = 120;
    CommitTransactionRequest commit_transaction = 121;
    RollbackTransactionRequest rollback_transaction = 122;
    ExecuteQueryRequest execute_query = 130;
    ExecuteUpdateRequest execute_update = 131;
    JdbcMetadataRequest metadata_catalogs = 140;
    JdbcMetadataRequest metadata_schemas = 141;
    JdbcMetadataRequest metadata_tables = 142;
    JdbcMetadataRequest metadata_columns = 143;
    JdbcMetadataRequest metadata_primary_keys = 144;
    JdbcMetadataRequest metadata_indexes = 145;
    JdbcMetadataRequest metadata_foreign_keys = 146;
    JdbcMetadataRequest metadata_table_types = 147;
    GrantCreditsRequest grant_credits = 132;
    CancelOperationRequest cancel_operation = 133;
  }
}

message ServerEnvelope {
  ResponseMeta meta = 1;

  oneof payload {
    ServerHello hello = 10;
    Pong pong = 11;
    ShutdownAck shutdown_ack = 12;
    QuiesceAck quiesce_ack = 13;
    ResumeAck resume_ack = 14;
    EngineError error = 15;
    DriverLoaded driver_loaded = 100;
    DriverUnloaded driver_unloaded = 101;
    SessionOpened session_opened = 110;
    SessionClosed session_closed = 111;
    TransactionStarted transaction_started = 120;
    TransactionCommitted transaction_committed = 121;
    TransactionRolledBack transaction_rolled_back = 122;
    QueryStarted query_started = 130;
    RowBatch row_batch = 131;
    QueryCompleted query_completed = 132;
    JdbcMetadataResult metadata_result = 140;
    UpdateCompleted update_completed = 133;
    CreditsGranted credits_granted = 134;
    OperationCancelled operation_cancelled = 135;
  }
}

message ClientHello {
  string runtime_name = 1;
  string runtime_version = 2;
  repeated ProtocolVersion supported_versions = 3;
  repeated string required_capabilities = 4;
  uint32 max_receive_frame_bytes = 5;
}

message ServerHello {
  string engine_name = 1;
  string engine_version = 2;
  string engine_instance_id = 3;
  ProtocolVersion selected_version = 4;
  repeated string capabilities = 5;
  uint32 max_receive_frame_bytes = 6;
}

message Ping {
  uint64 nonce = 1;
}

message Pong {
  uint64 nonce = 1;
  uint64 uptime_millis = 2;
}

message Shutdown {
  string reason = 1;
}

message ShutdownAck {}

message Quiesce {
  uint64 generation = 1;
  uint64 epoch = 2;
  uint64 nonce = 3;
}

message Resume {
  uint64 generation = 1;
  uint64 epoch = 2;
  uint64 nonce = 3;
}

message QuiescenceSnapshot {
  uint32 active_sessions = 1;
  uint32 active_operations = 2;
  uint32 active_control_tasks = 3;
  uint32 queued_control_tasks = 4;
  uint32 pending_cancellations = 5;
  uint32 pending_outbound_frames = 6;
}

message QuiesceAck {
  uint64 generation = 1;
  uint64 epoch = 2;
  uint64 nonce = 3;
  QuiescenceSnapshot snapshot = 4;
}

message ResumeAck {
  uint64 generation = 1;
  uint64 epoch = 2;
  uint64 nonce = 3;
}

message EngineError {
  string code = 1;
  string message = 2;
  ErrorCategory category = 3;
  bool retryable = 4;
  bool fatal = 5;
  OperationOutcome outcome = 6;
  map<string, string> metadata = 7;
  // Present only when category is ERROR_CATEGORY_DATABASE.
  DatabaseErrorDetail database_error = 8;
  // Present for session-bound failures when the post-failure state is known,
  // including cancellation and deadline errors without database_error.
  optional SessionState session_state = 9;
}

enum ErrorCategory {
  ERROR_CATEGORY_UNSPECIFIED = 0;
  ERROR_CATEGORY_PROTOCOL = 1;
  ERROR_CATEGORY_VALIDATION = 2;
  ERROR_CATEGORY_CANCELLED = 3;
  ERROR_CATEGORY_DEADLINE = 4;
  ERROR_CATEGORY_UNAVAILABLE = 5;
  ERROR_CATEGORY_DATABASE = 6;
  ERROR_CATEGORY_INTERNAL = 7;
}

enum OperationOutcome {
  OPERATION_OUTCOME_UNSPECIFIED = 0;
  OPERATION_OUTCOME_NOT_APPLICABLE = 1;
  OPERATION_OUTCOME_NOT_STARTED = 2;
  OPERATION_OUTCOME_KNOWN_FAILED = 3;
  OPERATION_OUTCOME_UNKNOWN = 4;
}
