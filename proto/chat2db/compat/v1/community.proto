syntax = "proto3";

package chat2db.compat.v1;

option java_multiple_files = true;
option java_package = "ai.chat2db.rust.compat.protocol.v1";
option java_outer_classname = "CommunityProtocol";

// Hard limits for the Community SPI boundary. Every string is counted in
// UTF-8 bytes. The Java engine and Rust client both enforce these values.
enum CommunityCountLimit {
  COMMUNITY_COUNT_LIMIT_UNSPECIFIED = 0;
  COMMUNITY_COUNT_LIMIT_MAX_DRIVER_CONFIGS = 32;
  COMMUNITY_COUNT_LIMIT_MAX_PLUGINS = 128;
  COMMUNITY_COUNT_LIMIT_MAX_CLASSPATH_ARTIFACTS = 256;
  COMMUNITY_COUNT_LIMIT_MAX_STATEMENTS = 4096;
}

enum CommunityDownloadUrlLimit {
  COMMUNITY_DOWNLOAD_URL_LIMIT_UNSPECIFIED = 0;
  COMMUNITY_DOWNLOAD_URL_LIMIT_MAX_DOWNLOAD_URLS = 32;
}

enum CommunitySchemaCountLimit {
  COMMUNITY_SCHEMA_COUNT_LIMIT_UNSPECIFIED = 0;
  COMMUNITY_SCHEMA_COUNT_LIMIT_MAX_SCHEMAS = 4096;
}

enum CommunityDatabaseCountLimit {
  COMMUNITY_DATABASE_COUNT_LIMIT_UNSPECIFIED = 0;
  COMMUNITY_DATABASE_COUNT_LIMIT_MAX_DATABASES = 4096;
}

enum CommunityTableCountLimit {
  COMMUNITY_TABLE_COUNT_LIMIT_UNSPECIFIED = 0;
  COMMUNITY_TABLE_COUNT_LIMIT_MAX_TABLES = 65536;
}

enum CommunityViewCountLimit {
  COMMUNITY_VIEW_COUNT_LIMIT_UNSPECIFIED = 0;
  COMMUNITY_VIEW_COUNT_LIMIT_MAX_VIEWS = 65536;
}

enum CommunityKeyCountLimit {
  COMMUNITY_KEY_COUNT_LIMIT_UNSPECIFIED = 0;
  COMMUNITY_KEY_COUNT_LIMIT_MAX_KEYS = 65536;
}

enum CommunityFunctionCountLimit {
  COMMUNITY_FUNCTION_COUNT_LIMIT_UNSPECIFIED = 0;
  COMMUNITY_FUNCTION_COUNT_LIMIT_MAX_FUNCTIONS = 65536;
}

enum CommunityProcedureCountLimit {
  COMMUNITY_PROCEDURE_COUNT_LIMIT_UNSPECIFIED = 0;
  COMMUNITY_PROCEDURE_COUNT_LIMIT_MAX_PROCEDURES = 65536;
}

enum CommunityTriggerCountLimit {
  COMMUNITY_TRIGGER_COUNT_LIMIT_UNSPECIFIED = 0;
  COMMUNITY_TRIGGER_COUNT_LIMIT_MAX_TRIGGERS = 65536;
}

enum CommunityRoutineParameterCountLimit {
  COMMUNITY_ROUTINE_PARAMETER_COUNT_LIMIT_UNSPECIFIED = 0;
  COMMUNITY_ROUTINE_PARAMETER_COUNT_LIMIT_MAX_PARAMETERS = 65536;
}

enum CommunitySqlDiagnosticCountLimit {
  COMMUNITY_SQL_DIAGNOSTIC_COUNT_LIMIT_UNSPECIFIED = 0;
  COMMUNITY_SQL_DIAGNOSTIC_COUNT_LIMIT_MAX_DIAGNOSTICS = 4096;
}

enum CommunityColumnCountLimit {
  COMMUNITY_COLUMN_COUNT_LIMIT_UNSPECIFIED = 0;
  COMMUNITY_COLUMN_COUNT_LIMIT_MAX_COLUMNS = 65536;
}

enum CommunityIndexCountLimit {
  COMMUNITY_INDEX_COUNT_LIMIT_UNSPECIFIED = 0;
  COMMUNITY_INDEX_COUNT_LIMIT_MAX_INDEXES = 65536;
}

enum CommunityIndexColumnCountLimit {
  COMMUNITY_INDEX_COLUMN_COUNT_LIMIT_UNSPECIFIED = 0;
  COMMUNITY_INDEX_COLUMN_COUNT_LIMIT_MAX_INDEX_COLUMNS = 65536;
}

enum CommunityByteLimit {
  COMMUNITY_BYTE_LIMIT_UNSPECIFIED = 0;
  COMMUNITY_BYTE_LIMIT_MAX_SOURCE_COMMIT_BYTES = 64;
  COMMUNITY_BYTE_LIMIT_MAX_DATABASE_TYPE_BYTES = 128;
  COMMUNITY_BYTE_LIMIT_MAX_PLUGIN_NAME_BYTES = 512;
  COMMUNITY_BYTE_LIMIT_MAX_COMMENT_BYTES = 65536;
  // Receivers MUST reject a Community response when either the accumulated raw
  // ServerEnvelope values for Community response fields, including duplicate
  // oneof fields, or the sum of all UTF-8 string field bytes exceeds this.
  COMMUNITY_BYTE_LIMIT_MAX_RESPONSE_BYTES = 8388608;
  COMMUNITY_BYTE_LIMIT_MAX_CLASSPATH_BYTES = 536870912;
}

message ListCommunityPluginsRequest {}

message CommunityDriverConfig {
  string url = 1;
  string jdbc_driver = 2;
  string jdbc_driver_class = 3;
  repeated string download_urls = 4;
  bool custom = 5;
  bool default_driver = 6;
}

message CommunityPluginDescriptor {
  string database_type = 1;
  string name = 2;
  bool supports_database = 3;
  bool supports_schema = 4;
  bool preserves_script_batch_execution = 5;
  repeated CommunityDriverConfig drivers = 6;
  bool metadata_available = 7;
  bool sql_builder_available = 8;
  bool sql_parser_available = 9;
}

message CommunityPluginCatalog {
  // Exact 40-character lowercase Git commit used to build the compatibility
  // classpath. Empty only when no Community classpath is configured.
  string source_commit = 1;
  repeated CommunityPluginDescriptor plugins = 2;
}

message ListCommunitySchemasRequest {
  string database_type = 1;
  // Empty asks JDBC DatabaseMetaData for every visible catalog.
  string database_name = 2;
  optional string transaction_id = 3;
}

message CommunitySchema {
  string database_name = 1;
  string name = 2;
  string comment = 3;
  string owner = 4;
  bool system = 5;
}

message CommunitySchemaList {
  repeated CommunitySchema schemas = 1;
}

message ListCommunityDatabasesRequest {
  string database_type = 1;
  optional string transaction_id = 2;
}

message CommunityDatabase {
  string name = 1;
  string comment = 2;
  string charset = 3;
  string collation = 4;
  string owner = 5;
  bool system = 6;
}

message CommunityDatabaseList {
  repeated CommunityDatabase databases = 1;
}

message ListCommunityTablesRequest {
  string database_type = 1;
  string database_name = 2;
  string schema_name = 3;
  string table_name_pattern = 4;
  optional string transaction_id = 5;
}

message CommunityTable {
  string database_name = 1;
  string schema_name = 2;
  string name = 3;
  string type = 4;
  string comment = 5;
  string database_type = 6;
  bool pinned = 7;
  string ddl = 8;
  string engine = 9;
  string charset = 10;
  string collation = 11;
  optional int64 increment_value = 12;
  string partition = 13;
  string tablespace = 14;
  optional int64 rows = 15;
  optional int64 data_length = 16;
  string create_time = 17;
  string update_time = 18;
}

message CommunityTableList {
  repeated CommunityTable tables = 1;
}

message ListCommunityViewsRequest {
  string database_type = 1;
  string database_name = 2;
  string schema_name = 3;
  string view_name_pattern = 4;
  optional string transaction_id = 5;
}

message CommunityViewList {
  repeated CommunityTable views = 1;
}

message ListCommunityColumnsRequest {
  string database_type = 1;
  string database_name = 2;
  string schema_name = 3;
  string table_name = 4;
  optional string transaction_id = 5;
}

message CommunityTableColumn {
  string database_name = 1;
  string schema_name = 2;
  string table_name = 3;
  string name = 4;
  string column_type = 5;
  optional int32 data_type = 6;
  string default_value = 7;
  optional bool auto_increment = 8;
  string comment = 9;
  optional bool primary_key = 10;
  string primary_key_name = 11;
  int32 primary_key_order = 12;
  optional int32 column_size = 13;
  optional int32 buffer_length = 14;
  optional int32 decimal_digits = 15;
  optional int32 num_prec_radix = 16;
  optional int32 sql_data_type = 17;
  optional int32 sql_datetime_sub = 18;
  optional int32 char_octet_length = 19;
  optional int32 ordinal_position = 20;
  optional int32 nullable = 21;
  optional bool generated_column = 22;
  string extent = 23;
  string charset = 24;
  string collation = 25;
  string unit = 26;
  optional bool sparse = 27;
  string default_constraint_name = 28;
  optional int32 seed = 29;
  optional int32 increment = 30;
  optional bool on_update_current_timestamp = 31;
}

message CommunityTableColumnList {
  repeated CommunityTableColumn columns = 1;
}

message ListCommunityIndexesRequest {
  string database_type = 1;
  string database_name = 2;
  string schema_name = 3;
  string table_name = 4;
  optional string transaction_id = 5;
}

message CommunityTableIndexColumn {
  string database_name = 1;
  string schema_name = 2;
  string table_name = 3;
  string index_name = 4;
  string column_name = 5;
  string type = 6;
  string comment = 7;
  optional int32 ordinal_position = 8;
  string collation = 9;
  optional bool non_unique = 10;
  string index_qualifier = 11;
  string sort_order = 12;
  optional int64 cardinality = 13;
  optional int64 pages = 14;
  string filter_condition = 15;
  optional int64 sub_part = 16;
}

message CommunityTableIndex {
  string database_name = 1;
  string schema_name = 2;
  string table_name = 3;
  string name = 4;
  string type = 5;
  optional bool unique = 6;
  string comment = 7;
  repeated CommunityTableIndexColumn columns = 8;
  optional bool concurrently = 9;
  string method = 10;
  string foreign_schema_name = 11;
  string foreign_table_name = 12;
  repeated string foreign_column_names = 13;
}

message CommunityTableIndexList {
  repeated CommunityTableIndex indexes = 1;
}

message ListCommunityTableKeysRequest {
  string database_type = 1;
  string database_name = 2;
  string schema_name = 3;
  string table_name = 4;
  optional string transaction_id = 5;
}

message CommunityForeignKey {
  string primary_table_database = 1;
  string primary_table_schema = 2;
  string primary_table_name = 3;
  string primary_column_name = 4;
  string foreign_table_database = 5;
  string foreign_table_schema = 6;
  string foreign_table_name = 7;
  string foreign_column_name = 8;
  int32 key_sequence = 9;
  int32 update_rule = 10;
  int32 delete_rule = 11;
  string foreign_key_name = 12;
  string primary_key_name = 13;
  int32 deferrability = 14;
}

message CommunityForeignKeyList {
  repeated CommunityForeignKey keys = 1;
}

message CommunityPrimaryKey {
  string database_name = 1;
  string schema_name = 2;
  string table_name = 3;
  string column_name = 4;
  string name = 5;
}

message CommunityPrimaryKeyList {
  repeated CommunityPrimaryKey keys = 1;
}

message ListCommunityFunctionsRequest {
  string database_type = 1;
  string database_name = 2;
  string schema_name = 3;
  optional string transaction_id = 4;
}

message GetCommunityFunctionRequest {
  string database_type = 1;
  string database_name = 2;
  string schema_name = 3;
  string function_name = 4;
  optional string transaction_id = 5;
}

message CommunityFunction {
  string database_name = 1;
  string schema_name = 2;
  string name = 3;
  string remarks = 4;
  optional int32 function_type = 5;
  string specific_name = 6;
  string body = 7;
  string template = 8;
}

message CommunityFunctionList {
  repeated CommunityFunction functions = 1;
}

message CommunityFunctionParameter {
  string function_database = 1;
  string function_schema = 2;
  string function_name = 3;
  string column_name = 4;
  optional int32 column_type = 5;
  optional int32 data_type = 6;
  string type_name = 7;
  optional int32 precision = 8;
  optional int32 length = 9;
  optional int32 scale = 10;
  optional int32 radix = 11;
  optional int32 nullable = 12;
  string remarks = 13;
  optional int32 char_octet_length = 14;
  optional int32 ordinal_position = 15;
  string is_nullable = 16;
  string specific_name = 17;
}

message CommunityFunctionParameterList {
  repeated CommunityFunctionParameter parameters = 1;
}

message ListCommunityProceduresRequest {
  string database_type = 1;
  string database_name = 2;
  string schema_name = 3;
  optional string transaction_id = 4;
}

message GetCommunityProcedureRequest {
  string database_type = 1;
  string database_name = 2;
  string schema_name = 3;
  string procedure_name = 4;
  optional string transaction_id = 5;
}

message CommunityProcedure {
  string database_name = 1;
  string schema_name = 2;
  string name = 3;
  string remarks = 4;
  optional int32 procedure_type = 5;
  string specific_name = 6;
  string body = 7;
}

message CommunityProcedureList {
  repeated CommunityProcedure procedures = 1;
}

message CommunityProcedureParameter {
  string procedure_database = 1;
  string procedure_schema = 2;
  string procedure_name = 3;
  string column_name = 4;
  optional int32 column_type = 5;
  optional int32 data_type = 6;
  string type_name = 7;
  optional int32 precision = 8;
  optional int32 length = 9;
  optional int32 scale = 10;
  optional int32 radix = 11;
  optional int32 nullable = 12;
  string remarks = 13;
  string column_default = 14;
  optional int32 sql_data_type = 15;
  optional int32 sql_datetime_sub = 16;
  optional int32 char_octet_length = 17;
  optional int32 ordinal_position = 18;
  string is_nullable = 19;
  string specific_name = 20;
}

message CommunityProcedureParameterList {
  repeated CommunityProcedureParameter parameters = 1;
}

message ListCommunityTriggersRequest {
  string database_type = 1;
  string database_name = 2;
  string schema_name = 3;
  optional string transaction_id = 4;
}

message GetCommunityTriggerRequest {
  string database_type = 1;
  string database_name = 2;
  string schema_name = 3;
  string trigger_name = 4;
  optional string transaction_id = 5;
}

message CommunityTrigger {
  string database_name = 1;
  string schema_name = 2;
  string name = 3;
  string event_manipulation = 4;
  string body = 5;
}

message CommunityTriggerList {
  repeated CommunityTrigger triggers = 1;
}

message BuildCommunityCreateSchemaRequest {
  string database_type = 1;
  CommunitySchema schema = 2;
}

message CommunityBuiltSql {
  string sql = 1;
}

message ParseCommunitySqlRequest {
  string database_type = 1;
  string sql = 2;
}

message ValidateCommunitySqlRequest {
  string database_type = 1;
  string sql = 2;
}

message CommunityParsedStatement {
  string sql = 1;
  string type = 2;
  string statement_type = 3;
}

message CommunitySqlAnalysis {
  bool is_select = 1;
  repeated CommunityParsedStatement statements = 2;
}

message CommunitySqlDiagnostic {
  uint32 start_line = 1;
  uint32 start_column = 2;
  uint32 end_line = 3;
  uint32 end_column = 4;
  string token_text = 5;
  string message = 6;
}

message CommunitySqlValidation {
  bool valid = 1;
  repeated CommunityParsedStatement statements = 2;
  repeated CommunitySqlDiagnostic diagnostics = 3;
}
