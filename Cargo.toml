[workspace]
resolver = "3"
members = [
    "apps/chat2db-cli",
    "apps/chat2db-web",
    "crates/chat2db-contract",
    "crates/chat2db-core",
    "crates/chat2db-engine-protocol",
    "crates/chat2db-java-bridge",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["OtterMind"]
license-file = "LICENSE"
repository = "https://github.com/OtterMind/Chat2DB-Rust"

[workspace.dependencies]
axum = "0.8.9"
clap = { version = "4.5", features = ["derive"] }
http-body-util = "0.1"
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2.6"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
